<div class="shell">
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-brand">
        <span class="sb-brand-title">MES Operations Suite</span>
        <span class="sb-brand-sub">Operations unified with Intelligence</span>
      </div>
    </div>

    <nav class="sb-nav">
      @for (item of navItems; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <app-icon class="nav-icon" [name]="item.icon" [size]="16" />
          <span>{{ item.label }}</span>
        </a>
      }
      <div class="nav-item" (click)="openOps360Toast()">
        <app-icon class="nav-icon" name="ops360" [size]="16" />
        <span>OPS360</span>
      </div>

      <div class="sb-sec-hdr">
        <a class="sb-sec-lbl" routerLink="/teams">Teams</a>
        <span class="sb-count">{{ teams().length }}</span>
      </div>
      @for (team of teams(); track team.id) {
        <a
          class="team-item"
          [routerLink]="['/teams', team.id]"
          routerLinkActive="active"
        >
          <span class="team-dot"></span>
          <span>{{ team.name }}</span>
        </a>
      }
      <div class="sb-add-team" (click)="openAddTeamDialog()">
        <app-icon name="add" [size]="13" />
        Add Team
      </div>
    </nav>

    <div class="sb-footer">
      <a class="sb-footer-item" routerLink="/settings" routerLinkActive="active">
        <app-icon name="settings" [size]="15" />
        <span>Settings</span>
      </a>
      <a class="sb-footer-item" routerLink="/help" routerLinkActive="active">
        <app-icon name="help" [size]="15" />
        <span>Help &amp; Support</span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title">{{ pageTitle() }}</span>
    </header>
    <div class="content-scroll">
      <router-outlet />
    </div>
  </div>
</div>
